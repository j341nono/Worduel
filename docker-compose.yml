services:
  postgres:
    image: postgres:16
    container_name: worduel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worduel
      POSTGRES_PASSWORD: worduel
      POSTGRES_DB: worduel
    ports:
      - "5432:5432"
    volumes:
      - worduel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worduel -d worduel"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: worduel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  worduel_pg:
